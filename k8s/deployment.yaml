apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs1-app
  namespace: nodejs1-app
  labels:
    app: nodejs1-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nodejs1-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: nodejs1-app
    spec:
      containers:
        - name: nodejs1-app
          image: nodejs1acr.azurecr.io/nodejs1-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: PORT
              value: "80"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 3
